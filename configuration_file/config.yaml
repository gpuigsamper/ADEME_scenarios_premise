# Configuration file for custom scenarios for `premise`
# Transition(s) 2050 / ADEME
# https://www.ademe.fr/les-futurs-en-transition/

---
regionalize:
  datasets:
    - name: carbon dioxide storage at synthetic natural gas plant, post, 400km pipeline, storage 3000m
      reference product: carbon dioxide storage at synthetic natural gas plant, post, 400km pipeline, storage 3000m
      exists in original database: True

    - name: ethanol production from sugar beet
      reference product: ethanol, without water, in 95% solution state, from fermentation
      exists in original database: True

    - name: ethanol production from whey
      reference product: ethanol, without water, in 95% solution state, from fermentation
      exists in original database: True

    - name: ethanol production from grass
      reference product: ethanol, without water, in 95% solution state, from fermentation
      exists in original database: True 

    - name: petrol, unleaded, burned in machinery
      reference product: petrol, unleaded, burned in machinery
      exists in original database: True

    - name: diesel, burned in agricultural machinery
      reference product: diesel, burned in agricultural machinery
      exists in original database: True
    
    - name: Farming of corn
      reference product: corn, harvested
      exists in original database: True

    - name: biomethane AD transport
      reference product: biomethane AD transport
      exists in original database: True

    - name: methane, from electrochemical methanation, transport
      reference product: methane, from electrochemical methanation, transport
      exists in original database: True 

production pathways:

